<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inquiries Inbox | Admin Panel</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../../favicon.png">
  
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; 
                 script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; 
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
                 font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
                 img-src 'self' https://images.unsplash.com data:;
                 connect-src 'self' https://*.supabase.co wss://*.supabase.co;">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="admin-layout">

  <!-- ==========================================================================
       SIDEBAR
       ========================================================================== -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <a href="../index.html" class="logo" style="color: white;">
        <i class="fa-solid fa-dumbbell"></i> IRONFORGE <span>GYM</span>
      </a>
    </div>
    
    <nav class="admin-menu">
      <ul>
        <li class="admin-menu-item">
          <a href="index.html" class="admin-menu-link">
            <i class="fa-solid fa-chart-line"></i> <span>Dashboard</span>
          </a>
        </li>
        <li class="admin-menu-item">
          <a href="members.html" class="admin-menu-link">
            <i class="fa-solid fa-users"></i> <span>Members</span>
          </a>
        </li>
        <li class="admin-menu-item">
          <a href="inquiries.html" class="admin-menu-link active">
            <i class="fa-solid fa-envelope-open-text"></i> <span>Inquiries</span>
            <span class="badge-count" id="inquiry-count-badge" style="display:none;">0</span>
          </a>
        </li>
        <li class="admin-menu-item">
          <a href="trainers.html" class="admin-menu-link">
            <i class="fa-solid fa-user-tie"></i> <span>Trainers</span>
          </a>
        </li>
        <li class="admin-menu-item">
          <a href="testimonials.html" class="admin-menu-link">
            <i class="fa-solid fa-comments"></i> <span>Testimonials</span>
          </a>
        </li>
        <li class="admin-menu-item">
          <a href="attendance.html" class="admin-menu-link">
            <i class="fa-solid fa-clipboard-user"></i> <span>Attendance</span>
          </a>
        </li>
      </ul>
    </nav>
    
    <div class="admin-sidebar-footer">
      <button class="btn btn-ghost btn-sm" id="btn-logout" style="width: 100%; border-color: rgba(255,255,255,0.2); color: white;">Logout</button>
    </div>
  </aside>

  <!-- ==========================================================================
       MAIN CONTENT
       ========================================================================== -->
  <main class="admin-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
      <div>
        <h2 style="font-size: 2.25rem; text-transform:none;">Manage Inquiries</h2>
        <p style="color:var(--text-muted); font-size:0.95rem;">Review and update status of public contact form inquiries.</p>
      </div>
    </div>
    
    <!-- Inquiries Table -->
    <div class="dashboard-card" style="padding:0; overflow:hidden;">
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Sender</th>
              <th>Contact Info</th>
              <th>Message</th>
              <th>Status</th>
              <th>Submitted</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inquiries-table-body">
            <!-- Dynamic data loaded by admin.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Toast alerts -->
  <div class="toast-container"></div>

  <!-- Supabase & Scripts -->
  <script type="module" src="../../js/auth.js"></script>
  <script type="module" src="../../js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Trainers | Admin Panel</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../../favicon.png">
  
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; 
                 script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; 
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
                 font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
                 img-src 'self' https://images.unsplash.com data:;
                 connect-src 'self' https://*.supabase.co wss://*.supabase.co;">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="admin-layout">

  <!-- ==========================================================================
       SIDEBAR
       ========================================================================== -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <a href="../index.html" class="logo" style="color: white;">
        <i class="fa-solid fa-dumbbell"></i> IRONFORGE <span>GYM</span>
      </a>
    </div>
    
    <nav class="admin-menu">
      <ul>
        <li class="admin-menu-item">
          <a href="index.html" class="admin-menu-link">
            <i class="fa-solid fa-chart-line"></i> <span>Dashboard</span>
          </a>
        </li>
        <li class="admin-menu-item">
          <a href="members.html" class="admin-menu-link">
            <i class="fa-solid fa-users"></i> <span>Members</span>
          </a>
        </li>
        <li class="admin-menu-item">
          <a href="inquiries.html" class="admin-menu-link">
            <i class="fa-solid fa-envelope-open-text"></i> <span>Inquiries</span>
            <span class="badge-count" id="inquiry-count-badge" style="display:none;">0</span>
          </a>
        </li>
        <li class="admin-menu-item">
          <a href="trainers.html" class="admin-menu-link active">
            <i class="fa-solid fa-user-tie"></i> <span>Trainers</span>
          </a>
        </li>
        <li class="admin-menu-item">
          <a href="testimonials.html" class="admin-menu-link">
            <i class="fa-solid fa-comments"></i> <span>Testimonials</span>
          </a>
        </li>
        <li class="admin-menu-item">
          <a href="attendance.html" class="admin-menu-link">
            <i class="fa-solid fa-clipboard-user"></i> <span>Attendance</span>
          </a>
        </li>
      </ul>
    </nav>
    
    <div class="admin-sidebar-footer">
      <button class="btn btn-ghost btn-sm" id="btn-logout" style="width: 100%; border-color: rgba(255,255,255,0.2); color: white;">Logout</button>
    </div>
  </aside>

  <!-- ==========================================================================
       MAIN CONTENT
       ========================================================================== -->
  <main class="admin-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; flex-wrap:wrap; gap:20px;">
      <div>
        <h2 style="font-size: 2.25rem; text-transform:none;">Manage Trainers</h2>
        <p style="color:var(--text-muted); font-size:0.95rem;">Review, add, edit, or delete personal training coaches.</p>
      </div>
      <div>
        <button class="btn btn-primary" id="btn-add-trainer"><i class="fa-solid fa-plus" style="margin-right:8px;"></i> Add Trainer</button>
      </div>
    </div>
    
    <!-- Trainers Directory List -->
    <div class="dashboard-card" style="padding:0; overflow:hidden;">
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Photo</th>
              <th>Name</th>
              <th>Specialization</th>
              <th>Experience</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="trainers-list-body">
            <!-- Dynamic data loaded by admin.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ==========================================================================
       ADD TRAINER MODAL
       ========================================================================== -->
  <div class="modal" id="add-trainer-modal">
    <div class="modal-content">
      <span class="modal-close"><i class="fa-solid fa-xmark"></i></span>
      <div class="modal-header">
        <h3>Add Training Specialist</h3>
      </div>
      <form id="add-trainer-form">
        <div class="form-group">
          <label for="add-trainer-name" class="form-label">Full Name *</label>
          <input type="text" id="add-trainer-name" class="form-input" placeholder="e.g. Alex Rivers" required>
        </div>
        <div class="form-group">
          <label for="add-trainer-spec" class="form-label">Specialization</label>
          <input type="text" id="add-trainer-spec" class="form-input" placeholder="e.g. Strength & Conditioning">
        </div>
        <div class="form-group">
          <label for="add-trainer-exp" class="form-label">Years of Experience</label>
          <input type="number" id="add-trainer-exp" class="form-input" placeholder="e.g. 5" min="0">
        </div>
        <div class="form-group">
          <label for="add-trainer-photo" class="form-label">Photo URL</label>
          <input type="url" id="add-trainer-photo" class="form-input" placeholder="https://images.unsplash.com/photo-...">
        </div>
        <div class="form-group">
          <label for="add-trainer-bio" class="form-label">Short Biography</label>
          <textarea id="add-trainer-bio" class="form-input" rows="3" placeholder="Brief statement about training styles..." style="resize:none;"></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:30px;">
          <button type="button" class="btn btn-ghost btn-modal-close">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Trainer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==========================================================================
       EDIT TRAINER MODAL
       ========================================================================== -->
  <div class="modal" id="edit-trainer-modal">
    <div class="modal-content">
      <span class="modal-close"><i class="fa-solid fa-xmark"></i></span>
      <div class="modal-header">
        <h3>Edit Trainer Profile</h3>
      </div>
      <form id="edit-trainer-form">
        <input type="hidden" id="edit-trainer-id">
        <div class="form-group">
          <label for="edit-trainer-name" class="form-label">Full Name *</label>
          <input type="text" id="edit-trainer-name" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="edit-trainer-spec" class="form-label">Specialization</label>
          <input type="text" id="edit-trainer-spec" class="form-input">
        </div>
        <div class="form-group">
          <label for="edit-trainer-exp" class="form-label">Years of Experience</label>
          <input type="number" id="edit-trainer-exp" class="form-input" min="0">
        </div>
        <div class="form-group">
          <label for="edit-trainer-photo" class="form-label">Photo URL</label>
          <input type="url" id="edit-trainer-photo" class="form-input">
        </div>
        <div class="form-group">
          <label for="edit-trainer-bio" class="form-label">Short Biography</label>
          <textarea id="edit-trainer-bio" class="form-input" rows="3" style="resize:none;"></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:30px;">
          <button type="button" class="btn btn-ghost btn-modal-close">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast alerts -->
  <div class="toast-container"></div>

  <!-- Supabase & Scripts -->
  <script type="module" src="../../js/auth.js"></script>
  <script type="module" src="../../js/admin.js"></script>
</body>
</html>
